<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Add the image-identification API URL here. It can also be supplied with ?imageApi=https://... -->
  <meta name="image-identification-api" content="">
  <meta name="image-identification-field" content="files">

  <title>A-Frame: Image Targets Example</title>
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous"
    data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
    crossorigin="anonymous"></script>
</head>

<body>
  <script src="bundle.js"></script>

  <div id="customLoader" role="status" aria-live="polite">
    <div class="loaderBox">
      <div class="brandMark" aria-hidden="true">
        <span></span>
      </div>
      <div class="loaderTitle">Preparing your Magic Video</div>
      <div class="loadingTrack" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <div id="scanOverlay" class="scanOverlay" aria-live="polite">
    <div class="scanHint">Keep your Gift inside the square</div>
    <div id="scanRegion" class="scanRegion" aria-hidden="true">
      <span class="scanCorner scanCornerTopLeft"></span>
      <span class="scanCorner scanCornerTopRight"></span>
      <span class="scanCorner scanCornerBottomLeft"></span>
      <span class="scanCorner scanCornerBottomRight"></span>
      <span class="scanLine"></span>
    </div>
    <div class="scanStatus">
      <span class="scanSpinner" aria-hidden="true"></span>
      <span>Searching image...</span>
    </div>
  </div>

  <a-scene xrextras-gesture-detector xrextras-runtime-error
    renderer="colorManagement:true"
    xrweb="allowedDevices: any; disableWorldTracking: true">

    <a-assets>
      <video id="magic-video" muted playsinline preload="metadata" crossorigin="anonymous" loop="true"></video>
    </a-assets>

    <a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>
    <a-light type="ambient" intensity="1"></a-light>

    <xrextras-named-image-target id="magic-image-target" name="">
      <a-entity xrextras-target-video-fade="video: #magic-video; height: 1; width: 0.79;"
        geometry="primitive: plane; height: 1; width: 0.79;"></a-entity>
    </xrextras-named-image-target>
  </a-scene>

  <div id="videoLoader" class="videoLoader" role="status" aria-live="polite" aria-hidden="true">
    <span class="videoSpinner" aria-hidden="true"></span>
    <span id="videoLoaderText">Buffering video...</span>
  </div>
</body>

</html>
