<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Add the image-identification API URL here. It can also be supplied with ?imageApi=https://... -->
  <meta name="image-identification-api" content="">
  <meta name="image-identification-field" content="files">

  <title>A-Frame: Image Targets Example</title>
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous"
    data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
    crossorigin="anonymous"></script>
</head>

<body>
  <script src="bundle.js"></script>

  <nav class="brandBar" aria-label="Sisu Logs navigation">
    <a class="brandHome" href="https://www.sisulogs.com/" aria-label="Go to Sisu Logs">
      <img src="./assets/logo.png" alt="" class="brandLogo">
      <span>Sisu Logs</span>
    </a>
    <a class="brandClose" href="https://www.sisulogs.com/" aria-label="Close and go to Sisu Logs">
      <span aria-hidden="true"></span>
    </a>
  </nav>

  <button id="soundToggle" class="soundToggle" type="button" aria-label="Mute video" aria-pressed="false">
    <svg class="soundIcon soundIconOn" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
      <path d="M16 8.2a5 5 0 0 1 0 7.6M18.5 5.7a8.5 8.5 0 0 1 0 12.6"></path>
    </svg>
    <svg class="soundIcon soundIconOff" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
      <path d="m16 9 5 5m0-5-5 5"></path>
    </svg>
  </button>

  <div id="customLoader" role="status" aria-live="polite">
    <div class="loaderBox">
      <div class="brandMark" aria-hidden="true">
        <span></span>
      </div>
      <div class="loaderTitle">Preparing your Magic Video</div>
      <div class="loadingTrack" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <div id="scanOverlay" class="scanOverlay" aria-live="polite">
    <div class="scanHint">Keep your Gift inside the square</div>
    <div id="scanRegion" class="scanRegion" aria-hidden="true">
      <span class="scanCorner scanCornerTopLeft"></span>
      <span class="scanCorner scanCornerTopRight"></span>
      <span class="scanCorner scanCornerBottomLeft"></span>
      <span class="scanCorner scanCornerBottomRight"></span>
      <span class="scanLine"></span>
    </div>
    <div class="scanStatus">
      <span class="scanSpinner" aria-hidden="true"></span>
      <span id="scanStatusText">Searching image...</span>
    </div>
  </div>

  <a-scene xrextras-gesture-detector xrextras-runtime-error
    renderer="colorManagement:true"
    xrweb="allowedDevices: any; disableWorldTracking: true">

    <a-assets>
      <video id="magic-video" muted playsinline preload="metadata" crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>
    <a-light type="ambient" intensity="1"></a-light>

    <xrextras-named-image-target id="magic-image-target" name="">
      <a-entity xrextras-target-video-fade="video: #magic-video; height: 1.08; width: 1.01;"
        geometry="primitive: plane; height: 1.08; width: 1.01;"></a-entity>
    </xrextras-named-image-target>
  </a-scene>

  <div id="videoLoader" class="videoLoader" role="status" aria-live="polite" aria-hidden="true">
    <span class="videoSpinner" aria-hidden="true"></span>
    <span id="videoLoaderText">Buffering video...</span>
  </div>

  <div id="identificationTimeout" class="timeoutOverlay" role="dialog" aria-modal="true"
    aria-labelledby="timeoutTitle" aria-hidden="true">
    <div class="timeoutCard">
      <div class="timeoutIcon" aria-hidden="true">!</div>
      <h2 id="timeoutTitle">Image not found</h2>
      <p>We couldn’t identify your image. Please try scanning it again.</p>
      <div class="timeoutActions">
        <button id="identificationTryAgain" class="timeoutButton timeoutButtonPrimary" type="button">Try again</button>
        <button id="identificationExit" class="timeoutButton timeoutButtonSecondary" type="button">Exit</button>
      </div>
    </div>
  </div>
</body>

</html>
